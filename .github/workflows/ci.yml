name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin https://github.com/MSAIE2027too/HR-Agent_static.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Set up dependencies
        run: |
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Verify deliverables contract (4 Markdown files at root)
        run: test -f README.md -a -f design-and-evaluation.md -a -f ai-tooling.md -a -f deployed.md && echo "contract 4-md at ROOT ok"

      - name: Verify FastAPI application import
        run: python3 -c "import app.main; print('FastAPI app import OK')"

      - name: Build and verify mock multi-format corpus
        run: |
          python3 mock_data/build_mock_corpus.py
          python3 -c "from pathlib import Path; exts={p.suffix.lower() for p in Path('mock_data').glob('*') if p.suffix}; print('Mock formats:', sorted(exts)); assert len(exts)>=3, exts"

      - name: Verify PDF ingestion parser
        run: python3 -c "from pathlib import Path; from app.ingest import ingest_file; n=len(ingest_file(Path('policy_docs/pto-policy.pdf'))); print('pdf chunks', n); assert n>0"

      - name: Run Pytest test suite (18 tests)
        run: python3 -m pytest tests/ -vv

      - name: Run standalone MCP discovery gate test
        run: python3 -m pytest tests/test_mcp_discovery.py -vv

      - name: Run RAG retrieval ablation benchmark (k=3 vs k=5)
        run: python3 evaluation/run_eval.py --eval-set evaluation/eval_set.jsonl --ablation-k 3,5

      - name: Run evaluation benchmark harness
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 evaluation/run_eval.py --eval-set evaluation/eval_set.jsonl

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping deploy (see deployed.md)"
          else
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          fi
